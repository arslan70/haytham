name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run plugin sanity tests
        run: pytest tests/test_plugin_sanity.py -v

      - name: Run eval Python syntax checks
        run: |
          python3 -m py_compile evals/shared.py
          python3 -m py_compile evals/triggering/run_triggering_evals.py
          python3 -m py_compile evals/quality/run_quality_evals.py
          python3 -m py_compile evals/e2e/consistency_checks.py
          python3 -m py_compile evals/e2e/run_e2e_eval.py
          python3 -m py_compile evals/e2e/ux_grader.py
