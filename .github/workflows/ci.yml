name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin manifest
        run: python3 -c "import json; json.load(open('.claude-plugin/plugin.json'))"

      - name: Validate hooks config
        run: python3 -c "import json; json.load(open('hooks/hooks.json'))"

      - name: Check agent files exist
        run: |
          for agent in idea-analyst market-researcher research-briefer report-synthesizer mvp-scoper capability-modeler architect story-planner; do
            test -f "agents/${agent}.md" || (echo "Missing agent: ${agent}.md" && exit 1)
          done

      - name: Check command files exist
        run: |
          for cmd in haytham validate specify design plan; do
            test -f "commands/${cmd}.md" || (echo "Missing command: ${cmd}.md" && exit 1)
          done

      - name: Check script files exist
        run: |
          test -f scripts/check_phase_prereqs.sh
          test -f scripts/validate_schema.py
          test -f scripts/validate_som.py
